name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Tests
        env:
          MPLBACKEND: Agg
        run: uv run pytest --cov --cov-report=term-missing

      - name: Sample set is reproducible
        run: |
          uv run python scripts/generate_sample_wavs.py --out /tmp/samples >/dev/null
          for f in data/samples/*.wav data/samples/manifest.csv; do
            cmp "$f" "/tmp/samples/$(basename "$f")"
          done

      - name: Headless CLI smoke test
        run: |
          uv run acoustic-agent analyze --synthetic --inject-bearing
          uv run acoustic-agent batch data/samples --out /tmp/batch.csv
